<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Интерактивная таблица Менделеева</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: #f4f6f9;
    color: #222;
    min-height: 100vh;
    padding: 20px;
  }

  header {
    max-width: 1200px;
    margin: 0 auto 20px;
  }
  h1 {
    font-size: 26px;
    margin-bottom: 6px;
    color: #1a237e;
  }
  .subtitle {
    color: #666;
    font-size: 14px;
  }

  .controls {
    max-width: 1200px;
    margin: 0 auto 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .controls input,
  .controls select {
    padding: 8px 12px;
    border: 1px solid #c8d0dd;
    border-radius: 6px;
    font-size: 14px;
    background: #fff;
    outline: none;
    transition: border-color 0.15s;
  }
  .controls input:focus,
  .controls select:focus { border-color: #1a73e8; }
  .controls input { flex: 1 1 220px; max-width: 320px; }

  .legend {
    max-width: 1200px;
    margin: 0 auto 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    font-size: 12px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    padding: 3px 6px;
    border-radius: 4px;
    transition: background 0.15s;
  }
  .legend-item:hover { background: rgba(0,0,0,0.06); }
  .legend-swatch {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    border: 1px solid rgba(0,0,0,0.1);
  }

  .table-scroll {
    overflow-x: auto;
    padding: 4px 0 20px;
  }
  .grid-inner {
    max-width: 1200px;
    margin: 0 auto;
    min-width: fit-content;
  }
  .grid-header,
  .periodic-table {
    display: grid;
    grid-template-columns: repeat(18, minmax(54px, 1fr));
    /* ЯВНО ЗАДАЕМ 10 СТРОК, ЧТОБЫ ЛАНТАНОИДЫ И АКТИНОИДЫ ОТОБРАЖАЛИСЬ */
    grid-template-rows: repeat(10, auto);
    gap: 3px;
  }
  .grid-header {
    margin-bottom: 3px;
  }
  .grid-header span {
    text-align: center;
    font-size: 11px;
    color: #7a8598;
    font-weight: 600;
    padding: 2px 0;
  }

  .el {
    position: relative;
    border-radius: 5px;
    padding: 3px 4px;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s, opacity 0.2s;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 60px;
    overflow: hidden;
    color: #111;
    border: 1px solid rgba(0,0,0,0.06);
    user-select: none;
  }
  .el:hover {
    transform: scale(1.12);
    z-index: 20;
    box-shadow: 0 6px 16px rgba(0,0,0,0.28);
  }
  .el .num { font-size: 10px; line-height: 1; opacity: 0.75; font-weight: 600; }
  .el .sym { font-size: 19px; line-height: 1; font-weight: 700; }
  .el .nm {
    font-size: 9px;
    line-height: 1.05;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0.9;
  }
  .el .ms { font-size: 8px; line-height: 1; opacity: 0.65; }

  .el.placeholder {
    border: 2px dashed rgba(0,0,0,0.18);
    background: transparent !important;
    color: #666;
    font-size: 11px;
    text-align: center;
    justify-content: center;
    align-items: center;
  }
  .el.placeholder .sym { font-size: 13px; font-weight: 600; }
  .el.placeholder .nm { font-size: 9px; }

  .el.dimmed { opacity: 0.12; pointer-events: none; }
  .el.highlight { outline: 3px solid #1a73e8; outline-offset: -1px; z-index: 5; }

  /* категории */
  .cat-alkali          { background: #ff8a80; }
  .cat-alkaline        { background: #ffcc80; }
  .cat-transition      { background: #ffe082; }
  .cat-post-transition { background: #c5e1a5; }
  .cat-metalloid       { background: #80cbc4; }
  .cat-nonmetal        { background: #81d4fa; }
  .cat-halogen         { background: #9fa8da; }
  .cat-noble           { background: #ce93d8; }
  .cat-lanthanide      { background: #f48fb1; }
  .cat-actinide        { background: #b39ddb; }
  .cat-unknown         { background: #bdbdbd; }

  /* модальное окно */
  .modal {
    display: none;
position: fixed;
    inset: 0;
    background: rgba(10,15,30,0.65);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.15s ease-out;
  }
  .modal.open { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal-card {
    background: #fff;
    border-radius: 14px;
    max-width: 520px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    position: relative;
    animation: pop 0.18s ease-out;
  }
  @keyframes pop { from { transform: scale(0.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .modal-close {
    position: absolute;
    top: 12px; right: 12px;
    background: none; border: none;
    font-size: 24px;
    cursor: pointer;
    color: #888;
    width: 32px; height: 32px;
    border-radius: 50%;
    transition: background 0.15s;
  }
  .modal-close:hover { background: #f0f0f0; color: #222; }

  .el-hero {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid #e8ecf1;
  }
  .el-hero-sym {
    width: 88px; height: 88px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: 1px solid rgba(0,0,0,0.08);
  }
  .el-hero-sym .n { font-size: 13px; opacity: 0.75; font-weight: 600; }
  .el-hero-sym .s { font-size: 34px; font-weight: 800; line-height: 1; }
  .el-hero-text h2 { font-size: 22px; margin-bottom: 4px; }
  .el-hero-text .badge {
    display: inline-block;
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 20px;
    background: #eef2f7;
    color: #455;
    font-weight: 600;
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 16px;
    font-size: 13px;
  }
  .info-item { display: flex; flex-direction: column; gap: 2px; }
  .info-item .label { color: #7a8598; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; }
  .info-item .value { font-size: 14px; font-weight: 500; }
  .info-item.full { grid-column: 1 / -1; }

  .config {
    font-family: 'Courier New', monospace;
    background: #f4f6f9;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 13px;
    display: inline-block;
    margin-top: 2px;
  }

  @media (max-width: 900px) {
    .grid-header, .periodic-table {
      grid-template-columns: repeat(18, 46px);
    }
    .el { min-height: 52px; }
    .el .sym { font-size: 16px; }
    .el .nm { font-size: 8px; }
    .el .ms { display: none; }
    h1 { font-size: 20px; }
  }
</style>
</head>

<div class="modal" id="modal">

</div>

 /* ========== Раскладка ========== */
function getPosition(num) {
  if (num === 1) return [1, 1];
  if (num === 2) return [18, 1];
  if (num >= 3 && num <= 4)   return [num - 2, 2];
  if (num >= 5 && num <= 10)  return [num + 8, 2];
  if (num >= 11 && num <= 12) return [num - 10, 3];
  if (num >= 13 && num <= 18) return [num, 3];
  if (num >= 19 && num <= 36) return [num - 18, 4];
  if (num >= 37 && num <= 54) return [num - 36, 5];
  if (num === 55) return [1, 6];
  if (num === 56) return [2, 6];
  if (num >= 57 && num <= 71) return [num - 54, 9];
  if (num >= 72 && num <= 86) return [num - 68, 6];
  if (num === 87) return [1, 7];
  if (num === 88) return [2, 7];
  if (num >= 89 && num <= 103) return [num - 86, 10];
  if (num >= 104 && num <= 118) return [num - 100, 7];
  return [1, 1];
}

/* ========== Названия категорий и цветов ========== */
const categories = {
  alkali:          { name: "Щелочные металлы" },
  alkaline:        { name: "Щёлочноземельные металлы" },
  transition:      { name: "Переходные металлы" },
  "post-transition": { name: "Постпереходные металлы" },
  metalloid:       { name: "Полуметаллы" },
  nonmetal:        { name: "Неметаллы" },
  halogen:         { name: "Галогены" },
  noble:           { name: "Благородные газы" },
  lanthanide:      { name: "Лантаноиды" },
  actinide:        { name: "Актиноиды" },
  unknown:         { name: "Неизвестные свойства" }
};

/* ========== Построение таблицы ========== */
const table = document.getElementById('table');
const gridHeader = document.getElementById('gridHeader');

for (let i = 1; i <= 18; i++) {
  const s = document.createElement('span');
  s.textContent = i;
  gridHeader.appendChild(s);
}

// плейсхолдеры для f-блока
function makePlaceholder(col, row, label, cat) {
  const d = document.createElement('div');
  d.className = el placeholder cat-${cat};
  d.style.gridColumn = col;
  d.style.gridRow = row;
  d.innerHTML = <div class="sym">${label}</div><div class="nm">${categories[cat].name}</div>;
  table.appendChild(d);
}
makePlaceholder(3, 6, '57–71', 'lanthanide');
makePlaceholder(3, 7, '89–103', 'actinide');

// элементы
elements.forEach(el => {
  const [num, sym, name, mass, cat] = el;
  const [col, row] = getPosition(num);
  const div = document.createElement('div');
  div.className = el cat-${cat};
  div.style.gridColumn = col;
  div.style.gridRow = row;
  div.dataset.num = num;
  div.dataset.cat = cat;
  div.dataset.search = ${num} ${sym} ${name}.toLowerCase();
  div.innerHTML = `
    <div class="num">${num}</div>
    <div class="sym">${sym}</div>
    <div class="nm">${name}</div>
    <div class="ms">${mass}</div>
  `;
  div.addEventListener('click', () => showDetails(el));
  table.appendChild(div);
});

/* ========== Легенда ========== */
const legend = document.getElementById('legend');
Object.keys(categories).forEach(key => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.innerHTML = <div class="legend-swatch cat-${key}"></div><span>${categories[key].name}</span>;
  item.addEventListener('click', () => {
    document.getElementById('filter').value = key;
    applyFilter();
  });
  legend.appendChild(item);
});

/* ========== Модальное окно ========== */
const modal = document.getElementById('modal');
const modalCard = document.getElementById('modalCard');

function kToC(k) {
  if (k == null) return '—';
  return ${(k - 273.15).toFixed(1)} °C;
}
function fmtDensity(d) {
  if (d == null) return '—';
  return d < 0.01 ? ${(d * 1000).toFixed(3)} г/л : ${d} г/см³;
}
function fmtMass(m) {
  return Number.isInteger(m) ? m.toString() : m.toFixed(m < 100 ? 4 : 2);
}

function showDetails(el) {
  const [num, sym, name, mass, cat, en, mp, bp, density, year, state] = el;
  const [col, row] = getPosition(num);
  const period = row <= 7 ? row : (row === 9 ? 6 : 7);
  const block = getPosition(num)[1] === 9 || getPosition(num)[1] === 10
    ? 'f'
    : (col <= 2 ? 's' : (col <= 12 ? 'd' : 'p'));
  const group = (row === 9 || row === 10) ? '—' : col;
  const catName = categories[cat].name;

  modalCard.innerHTML = `
 <button class="modal-close" onclick="closeModal()">×</button>
    <div class="el-hero">
      <div class="el-hero-sym cat-${cat}">
        <span class="n">${num}</span>
        <span class="s">${sym}</span>
      </div>
      <div class="el-hero-text">
        <h2>${name}</h2>
        <span class="badge">${catName}</span>
      </div>
    </div>
    <div class="info-grid">
      <div class="info-item"><span class="label">Атомная масса</span><span class="value">${fmtMass(mass)} а.е.м.</span></div>
      <div class="info-item"><span class="label">Агрегатное состояние</span><span class="value">${state} (25 °C)</span></div>
      <div class="info-item"><span class="label">Группа</span><span class="value">${group}</span></div>
      <div class="info-item"><span class="label">Период</span><span class="value">${period}</span></div>
      <div class="info-item"><span class="label">Блок</span><span class="value">${block}-блок</span></div>
      <div class="info-item"><span class="label">Год открытия</span><span class="value">${year < 0 ? ${-year} до н.э. : year}</span></div>
      <div class="info-item"><span class="label">Электроотрицательность</span><span class="value">${en ?? '—'}</span></div>
      <div class="info-item"><span class="label">Плотность</span><span class="value">${fmtDensity(density)}</span></div>
      <div class="info-item"><span class="label">Т. плавления</span><span class="value">${kToC(mp)}</span></div>
      <div class="info-item"><span class="label">Т. кипения</span><span class="value">${kToC(bp)}</span></div>
      <div class="info-item full"><span class="label">Электронная конфигурация</span><span class="config">${getConfig(num)}</span></div>
    </div>
  `;
  modal.classList.add('open');
}

function closeModal() {
  modal.classList.remove('open');
}
modal.addEventListener('click', e => {
  if (e.target === modal) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

/* ========== Электронная конфигурация (упрощённо) ========== */
function getConfig(num) {
  const shells = [
    { name: '1s', cap: 2 }, { name: '2s', cap: 2 }, { name: '2p', cap: 6 },
    { name: '3s', cap: 2 }, { name: '3p', cap: 6 }, { name: '4s', cap: 2 },
    { name: '3d', cap: 10 }, { name: '4p', cap: 6 }, { name: '5s', cap: 2 },
    { name: '4d', cap: 10 }, { name: '5p', cap: 6 }, { name: '6s', cap: 2 },
    { name: '4f', cap: 14 }, { name: '5d', cap: 10 }, { name: '6p', cap: 6 },
    { name: '7s', cap: 2 }, { name: '5f', cap: 14 }, { name: '6d', cap: 10 },
    { name: '7p', cap: 6 }
  ];
  let remaining = num;
  const parts = [];
  for (const sh of shells) {
    if (remaining <= 0) break;
    const e = Math.min(sh.cap, remaining);
    parts.push(`${sh.name}${e}`);
    remaining -= e;
  }
  return parts.join(' ');
}

/* ========== Поиск и фильтр ========== */
const searchInput = document.getElementById('search');
const filterSelect = document.getElementById('filter');

function applyFilter() {
  const q = searchInput.value.trim().toLowerCase();
  const cat = filterSelect.value;
  document.querySelectorAll('.el[data-num]').forEach(cell => {
    const matchesText = q === '' || cell.dataset.search.includes(q);
    const matchesCat = cat === 'all' || cell.dataset.cat === cat;
    if (matchesText && matchesCat) {
      cell.classList.remove('dimmed');
      if (q !== '' || cat !== 'all') cell.classList.add('highlight');
      else cell.classList.remove('highlight');
    } else {
      cell.classList.add('dimmed');
      cell.classList.remove('highlight');
    }
  });
}
searchInput.addEventListener('input', applyFilter);
filterSelect.addEventListener('change', applyFilter);

/* ========== Тепловая карта ========== */
const heatmapSelect = document.getElementById('heatmap');
const propMap = { en: 5, mp: 6, bp: 7, density: 8 };

function applyHeatmap() {
  const prop = heatmapSelect.value;
  const cells = document.querySelectorAll('.el[data-num]');

  // сброс
  cells.forEach(c => {
    c.style.background = '';
    c.style.color = '';
  });

  if (prop === 'none') return;
 const idx = propMap[prop];
  const data = elements
    .map(e => ({ num: e[0], val: e[idx] }))
    .filter(e => e.val != null && e.val > 0);

  if (data.length === 0) return;

  const minV = Math.min(...data.map(d => d.val));
  const maxV = Math.max(...data.map(d => d.val));
  const lmin = Math.log(minV);
  const lmax = Math.log(maxV);

  // нейтральный цвет для отсутствующих данных
  cells.forEach(c => {
    const num = +c.dataset.num;
    const el = elements.find(e => e[0] === num);
    if (!el  el[idx] == null  el[idx] <= 0) {
      c.style.background = '#e0e3e8';
    }
  });

  data.forEach(({ num, val }) => {
    const cell = document.querySelector(`.el[data-num="${num}"]`);
    if (!cell) return;
    const t = (Math.log(val) - lmin) / (lmax - lmin);
    const hue = 240 - t * 240; // синий (низко) → красный (высоко)
    cell.style.background = hsl(${hue}, 75%, 55%);
    cell.style.color = t > 0.45 ? '#fff' : '#111';
  });
}
heatmapSelect.addEventListener('change', applyHeatmap);
</script>
